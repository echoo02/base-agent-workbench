name: Base contract deployment verifier tests

on:
  push:
    paths:
      - "examples/base-contract-deployment-verifier/**"
      - ".github/workflows/base-contract-deployment-verifier-tests.yml"
  pull_request:
    paths:
      - "examples/base-contract-deployment-verifier/**"
      - ".github/workflows/base-contract-deployment-verifier-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run contract deployment verifier tests
        run: node --test examples/base-contract-deployment-verifier/index.test.mjs
