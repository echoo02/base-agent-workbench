name: Base ERC-20 transfer calldata tests

on:
  push:
    paths:
      - "examples/base-erc20-transfer-calldata/**"
      - ".github/workflows/base-erc20-transfer-calldata.yml"
  pull_request:
    paths:
      - "examples/base-erc20-transfer-calldata/**"
      - ".github/workflows/base-erc20-transfer-calldata.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run transfer calldata tests
        run: node --test examples/base-erc20-transfer-calldata/index.test.mjs
