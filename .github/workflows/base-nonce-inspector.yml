name: Base nonce inspector tests

on:
  push:
    paths:
      - "examples/base-nonce-inspector/**"
      - ".github/workflows/base-nonce-inspector.yml"
  pull_request:
    paths:
      - "examples/base-nonce-inspector/**"
      - ".github/workflows/base-nonce-inspector.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run nonce inspector tests
        run: node --test examples/base-nonce-inspector/index.test.mjs
