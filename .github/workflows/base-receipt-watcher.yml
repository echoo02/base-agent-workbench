name: Base receipt watcher tests

on:
  push:
    paths:
      - "examples/base-receipt-watcher/**"
      - ".github/workflows/base-receipt-watcher.yml"
  pull_request:
    paths:
      - "examples/base-receipt-watcher/**"
      - ".github/workflows/base-receipt-watcher.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run receipt watcher tests
        run: node --test examples/base-receipt-watcher/index.test.mjs
