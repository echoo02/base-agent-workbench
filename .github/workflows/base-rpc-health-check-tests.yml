name: Base RPC health check tests

on:
  pull_request:
    paths:
      - "examples/base-rpc-health-check/**"
      - ".github/workflows/base-rpc-health-check-tests.yml"
  push:
    branches: [main, feat/base-rpc-health-check]
    paths:
      - "examples/base-rpc-health-check/**"
      - ".github/workflows/base-rpc-health-check-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Base RPC health check tests
        run: node --test examples/base-rpc-health-check/index.test.mjs
