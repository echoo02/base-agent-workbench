name: Base ERC-20 allowance inspector tests

on:
  push:
    paths:
      - "examples/base-erc20-allowance/**"
      - ".github/workflows/base-erc20-allowance.yml"
  pull_request:
    paths:
      - "examples/base-erc20-allowance/**"
      - ".github/workflows/base-erc20-allowance.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run allowance inspector tests
        run: node --test examples/base-erc20-allowance/index.test.mjs
